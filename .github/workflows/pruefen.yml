name: Übungsdatenbank prüfen

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core poppler-utils
          python -m pip install -q pyyaml ruamel.yaml reportlab svglib pytest
      - name: Übungskarten prüfen
        run: python scripts/pruefen.py
      - name: Tests
        run: python -m pytest -q
