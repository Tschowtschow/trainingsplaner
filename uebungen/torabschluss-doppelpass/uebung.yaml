name: Torabschluss nach Doppelpass
schwerpunkte: [Torabschluss, Passspiel]
phase: [Hauptteil]
spieler_min: 6
spieler_max: 18
torhueter: ja
feldgroesse: 30 x 30 m (Strafraum + Vorfeld)
material: [1 Großtor, 2 Stangen, 4 Hütchen, 15 Bälle]
dauer_min: 15
intensitaet: 3
ablauf:
  - Startposition A mit Bällen 25 m vor dem Tor, Anspieler B an der Stange auf Höhe Strafraumgrenze.
  - A spielt flach auf B und startet.
  - B lässt direkt in den Lauf von A prallen (Doppelpass).
  - A schließt nach maximal 2 Kontakten aufs Tor ab.
  - A wird neuer Anspieler, B holt den Ball und stellt sich bei A an.
regeln:
  - Abschluss spätestens an der Strafraumgrenze.
  - Torhüter darf herauslaufen.
coachingpunkte:
  - Pass scharf und flach in den richtigen Fuß des Anspielers.
  - Tempo nach dem Pass erhöhen, nicht stehen bleiben.
  - Erster Kontakt nach vorne mitnehmen, Kopf hoch vor dem Abschluss.
  - Abschluss flach ins lange Eck.
varianten:
  leichter: [Ohne Zeitdruck, Abschluss aus 16 m]
  schwerer: [Verteidiger startet 2 s nach dem Pass hinterher, Abschluss nur mit schwachem Fuß]
  spielerzahl:
    - Ab 12 Spielern zwei Stationen spiegelverkehrt (links/rechts) auf ein Tor, abwechselnd starten.
    - Mit 2 Torhütern nach 5 Minuten wechseln, der zweite macht parallel TW-Training.
quelle: eigene Übung (Beispiel)
feedback: []
