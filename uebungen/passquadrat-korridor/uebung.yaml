name: Passquadrat im Korridor (3 Stufen)
schwerpunkte: [Passspiel, Koordination]
phase: [Erweitertes Aufwärmen, Hauptteil]
spieler_min: 5
spieler_max: 24
torhueter: nein
feldgroesse: "Außenquadrat 20 x 20 m, Innenquadrat 12 x 12 m (Korridor ca. 4 m breit) pro Gruppe (unsicher)"
material: [4 Hütchen pro Gruppe (Außenecken), 4 Stangen pro Gruppe (Innenecken), 2 Bälle pro Gruppe]
dauer_min: 15
intensitaet: 2
ablauf:
  - Pro Gruppe ein Außenquadrat (Hütchen) und darin ein Innenquadrat (Stangen) aufbauen. Gespielt wird nur im Korridor dazwischen, das Innenquadrat bleibt frei.
  - In jeder der 4 Ecken des Korridors steht ein Spieler, an der Startecke zwei (mit Ball). Der Ball läuft immer in dieselbe Richtung ums Quadrat.
  - "Stufe 1 – Passen und nachlaufen: Pass flach in die nächste Ecke, dem Pass hinterherlaufen und dort anstellen. Der Empfänger nimmt in Laufrichtung mit und spielt weiter."
  - "Stufe 2 – Pass in den Lauf: Der Ballführende dribbelt die Seite entlang. Der Spieler in der nächsten Ecke startet die nächste Seite hinauf und bekommt den Ball diagonal in den Lauf. Der Passgeber übernimmt die freie Ecke."
  - "Stufe 3 – Klatschen und tief: Der Ballführende spielt in die nächste Ecke, der Eckspieler lässt direkt zurückprallen und startet die nächste Seite hinauf. Dritter Pass in seinen Lauf, der Passgeber übernimmt die Ecke."
  - Je Stufe ca. 4-5 min, nach der Hälfte die Laufrichtung wechseln (anderer Fuß).
regeln:
  - Nur flache Pässe, maximal 2 Kontakte (Stufe 3 Klatschen direkt).
  - Innenquadrat wird nicht betreten.
  - Mit 2 Bällen gleichzeitig spielen, sobald es flüssig läuft (Start in gegenüberliegenden Ecken).
coachingpunkte:
  - Offene Stellung, Ball mit dem hinteren (ballfernen) Fuß in Laufrichtung annehmen.
  - Pass scharf und flach auf den Fuß bzw. in den Lauf – nicht hinter den Mann.
  - Timing beim Freilaufen (Stufe 2/3) – erst starten, wenn der Passgeber den Kopf hebt.
  - Blickkontakt und Ansage vor jedem Pass.
varianten:
  leichter: [3 Kontakte, Korridor 5 m breit, nur ein Ball]
  schwerer: [Direktspiel, nur schwacher Fuß, 2 Bälle gleichzeitig, Wettkampf zwischen zwei Gruppen (wer schafft zuerst 20 Pässe ohne Fehler)]
  spielerzahl:
    - Ideal 6-8 Spieler pro Quadrat (an der Startecke 2-3 Spieler, sonst 1 pro Ecke).
    - 14 Spieler = 2 Quadrate à 7; 16 = 2 à 8; ab 18 drei Quadrate.
    - Mit 5 Spielern geht es nur mit einem Ball.
quelle: https://www.instagram.com/reel/De3it5is6Nl/
unsicher:
  - Maße nur aus der Animation geschätzt (Außenquadrat ca. 20 x 20 m, Korridor ca. 4 m).
  - "Stufe 2: ob der Diagonalpass über die Ecke des Innenquadrats gehen darf oder im Korridor bleiben muss."
  - Video zeigt nur den Ballweg ohne Text oder Sprache – Kontaktzahl und Wechsel sind eigene Vorgaben.
