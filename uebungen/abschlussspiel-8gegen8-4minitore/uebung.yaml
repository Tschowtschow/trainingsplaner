name: Abschlussspiel 8 gegen 8 auf 4 Minitore (ohne Torhüter)
schwerpunkte: [Passspiel, Spielaufbau, Umschalten]
phase: [Abschlussspiel]
spieler_min: 10
spieler_max: 20
torhueter: nein
feldgroesse: halber Platz quer, ca. 60 x 50 m (Spielrichtung über die Platzbreite)
material: [4 Minitore, 8 Hütchen, Leibchen, 15 Bälle]
dauer_min: 25
intensitaet: 4
ablauf:
  - Zwei Teams spielen quer auf dem halben Platz. Jedes Team verteidigt 2 Minitore auf seiner Grundlinie (ca. 25 m auseinander) und greift die 2 Minitore des Gegners an.
  - Vor jedem Minitor eine 3-m-Zone mit Hütchen, die kein Spieler betreten darf (Abschluss von außerhalb).
  - Neuer Ball immer vom Trainer an der Seitenlinie, damit kaum Pausen entstehen.
  - 2 Halbzeiten à 11-12 Minuten, dazwischen Trinkpause und kurze Ansprache.
regeln:
  - Normales Spiel, kein Abseits, Einwurf als Einpass oder Eindribbeln.
  - Schwerpunktregel - Tor nach mindestens 6 Pässen in Folge zählt doppelt.
  - Tor nach Seitenverlagerung (Angriff auf das eine Tor, Abschluss auf das andere) zählt doppelt.
coachingpunkte:
  - Passspiel aus dem Hauptteil sichtbar machen - Dreiecke, offene Stellung, schnelle Verlagerung.
  - Wenn ein Tor zugestellt ist, das andere angreifen (Spiel breit machen).
  - Wenig unterbrechen, nur kurze Hinweise in Spielpausen.
  - Nach Ballverlust sofort Gegenpressing, die eigenen Tore sind ohne TW offen.
varianten:
  leichter: [Neutraler Joker für das ballbesitzende Team, Zone vor den Toren weglassen]
  schwerer: [Maximal 2 Kontakte in der eigenen Hälfte, Tor zählt nur nach mindestens 4 Pässen]
  spielerzahl:
    - 16 Spieler = 8 gegen 8; 14 Spieler = 7 gegen 7.
    - Ungerade Zahl - ein neutraler Joker.
    - Ab 18 Spielern zweites Spiel 4 gegen 4 im DFB-Käfig, nach der Halbzeit tauschen.
    - Mit Torhütern - stattdessen abschlussspiel-grosstor-minitore spielen.
quelle: eigene Übung (neu)
unsicher: []
feedback: []
