name: Rondo 5 gegen 2
schwerpunkte: [Passspiel, Pressing]
phase: [Erweitertes Aufwärmen]
spieler_min: 7
spieler_max: 21
torhueter: nein
feldgroesse: 12 x 12 m pro Gruppe (8 x 8 m bei 4 gegen 2)
material: [4 Hütchen pro Gruppe, 2-3 Bälle pro Gruppe, Leibchen]
gruppengroesse: [6, 8]   # 4 gegen 2 bis 6 gegen 2
dauer_min: 12
intensitaet: 3
ablauf:
  - 5 Spieler am Rand des Quadrats, 2 Verteidiger in der Mitte.
  - Außenspieler halten den Ball mit maximal 2 Kontakten in den eigenen Reihen.
  - Erobert ein Verteidiger den Ball oder spielt ihn ins Aus, wechselt er mit dem Spieler, der den Fehler gemacht hat.
  - Nach 10 Pässen in Folge müssen die Verteidiger 5 Liegestütze machen (oder bleiben eine weitere Runde drin).
regeln:
  - Maximal 2 Ballkontakte für Außenspieler.
  - Kein Pass über Kopfhöhe.
  - Außenspieler dürfen sich auf ihrer Linie frei bewegen.
coachingpunkte:
  - Offene Stellung zum Ball, Ball mit dem richtigen (ballfernen) Fuß annehmen.
  - Pass durch die Mitte zwischen den Verteidigern sucht man zuerst.
  - "Verteidiger arbeiten zu zweit: einer läuft an, der zweite schließt die Passlinie durch die Mitte."
  - Schnelles Umschalten nach Ballgewinn.
varianten:
  leichter: [3 Kontakte erlaubt, Feld 15 x 15 m]
  schwerer: [Direktspiel, Feld 10 x 10 m, 4 gegen 2]
  spielerzahl:
    - 7 Spieler = 1 Gruppe; 14 Spieler = 2 Gruppen; Rest als 6. Außenspieler (6 gegen 2) einbauen.
    - Ungerade Zahl - Gruppen mit 4 gegen 2 und 5 gegen 2 mischen.
quelle: eigene Übung (Beispiel)
unsicher: []
feedback: []
