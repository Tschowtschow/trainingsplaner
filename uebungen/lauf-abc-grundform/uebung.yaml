name: Lauf-ABC Grundform
schwerpunkte: [Koordination, Athletik]
phase: [Lauf-ABC]
spieler_min: 4
spieler_max: 24
torhueter: optional
feldgroesse: 4 Bahnen à 20 m
material: [8 Hütchen]
dauer_min: 10
intensitaet: 2
ablauf:
  - 4 Bahnen à 20 m, Spieler verteilen sich gleichmäßig auf die Startpositionen.
  - Jede Übung auf 15 m, zurück locker traben.
  - "Reihenfolge: Fußgelenksarbeit, Skippings, Anfersen, Kniehebelauf, Hopserlauf, Seitgalopp (beide Seiten), Überkreuzlauf, Rückwärtslauf."
  - Zum Abschluss 2 Steigerungsläufe auf 20 m (ca. 80 %).
regeln:
  - Nächster startet, wenn der Vordermann 5 m entfernt ist.
coachingpunkte:
  - Aufrechter Oberkörper, aktiver Armeinsatz.
  - Auf dem Vorfuß landen, kurze Bodenkontakte.
  - Qualität vor Tempo.
varianten:
  leichter: [Nur 5 Grundübungen, keine Steigerungsläufe]
  schwerer: [Mit Ball in den Händen, Richtungswechsel auf Zuruf am Ende der Bahn]
  spielerzahl:
    - Bis 8 Spieler 2 Bahnen, ab 16 Spielern 5-6 Bahnen.
quelle: eigene Übung (Beispiel, neu)
unsicher: []
feedback: []
