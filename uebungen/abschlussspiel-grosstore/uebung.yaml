name: Abschlussspiel auf zwei Großtore
schwerpunkte: [Torabschluss, Umschalten]
phase: [Abschlussspiel]
spieler_min: 10
spieler_max: 22
torhueter: ja
feldgroesse: 50 x 40 m (Strafraum bis Strafraum, verkürzt)
material: [2 Großtore, 8 Hütchen, Leibchen, Bälle in beiden Toren]
dauer_min: 20
intensitaet: 4
ablauf:
  - Zwei Teams spielen auf zwei Großtore mit Torhütern.
  - 2 x 9 Minuten, dazwischen 2 Minuten Pause.
  - Nach Torerfolg oder Aus startet der Torhüter sofort mit einem neuen Ball.
regeln:
  - Normales Spiel, kein Abseits.
  - "Schwerpunktregel Torabschluss: Ein Tor nach maximal 3 Kontakten im letzten Drittel zählt doppelt."
coachingpunkte:
  - Im letzten Drittel den Abschluss suchen statt quer spielen.
  - Nach Ballverlust sofort Gegenpressing (5 Sekunden).
  - Nachsetzen bei Abprallern.
varianten:
  leichter: [Neutraler Joker spielt mit der ballbesitzenden Mannschaft]
  schwerer: [Max. 2 Kontakte im ganzen Feld]
  spielerzahl:
    - 10 Feldspieler = 5 gegen 5 auf 40 x 30 m.
    - 14 Feldspieler = 7 gegen 7 auf 50 x 40 m.
    - Ungerade Zahl = ein neutraler Joker.
    - Nur 1 TW = ein Tor mit TW, auf der anderen Seite zwei Minitore.
quelle: eigene Übung (Beispiel)
feedback: []
