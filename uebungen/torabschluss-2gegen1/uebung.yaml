name: Torabschluss 2 gegen 1 nach Doppelpass
schwerpunkte: [Torabschluss, Passspiel, Umschalten]
phase: [Hauptteil]
spieler_min: 8
spieler_max: 18
torhueter: ja
feldgroesse: 30 x 40 m vor dem Großtor
material: [4 Hütchen, 2 Stangen, 15 Bälle, Leibchen]   # Großtor ist am Platz
dauer_min: 20
intensitaet: 4
ablauf:
  - Zwei Angreifer starten 30 m vor dem Tor, ein Verteidiger wartet an der Strafraumgrenze.
  - Angreifer 1 spielt einen Doppelpass mit Angreifer 2 und dribbelt an.
  - Der Verteidiger startet beim ersten Pass und versucht, den Abschluss zu verhindern.
  - Die Angreifer spielen das 2 gegen 1 bis zum Abschluss aus (max. 8 Sekunden).
  - Erobert der Verteidiger den Ball, kontert er auf zwei Minitore an der Startlinie.
regeln:
  - Abschluss innerhalb von 8 Sekunden nach dem ersten Pass.
  - Tor nach Direktabschluss zählt doppelt.
coachingpunkte:
  - Ballführender geht auf den Verteidiger zu und bindet ihn, bevor er abspielt.
  - Mitspieler bietet sich in die Tiefe an, nicht auf gleicher Höhe.
  - Abschluss früh suchen, wenn der Verteidiger falsch steht.
  - Verteidiger lenkt nach außen und bleibt lange auf den Beinen.
varianten:
  leichter: [Verteidiger startet 2 Sekunden später, 12 Sekunden Zeit]
  schwerer: [3 gegen 2, zweiter Verteidiger läuft von hinten nach]
  spielerzahl:
    - Ab 12 Feldspielern zwei Startgruppen links und rechts, abwechselnd starten.
    - Verteidiger nach 3 Durchgängen tauschen.
quelle: eigene Übung (Beispiel, neu)
unsicher: []
feedback: []
