name: Positionsspiel 6 gegen 6 plus 4 Außenjoker
schwerpunkte: [Passspiel, Pressing]
phase: [Hauptteil]
spieler_min: 12
spieler_max: 18
torhueter: nein
feldgroesse: 35 x 30 m (mit Hütchen markiert)
material: [8 Hütchen, Leibchen in 3 Farben, 10 Bälle]
dauer_min: 25
intensitaet: 4
ablauf:
  - Zwei Teams à 6 spielen im Feld gegeneinander, 4 neutrale Joker stehen außen (eine Seite je Joker) und spielen immer mit dem ballbesitzenden Team.
  - Das Team in Ballbesitz versucht, den Ball zu halten und Punkte zu sammeln, das andere Team presst und will den Ball erobern.
  - 10 Pässe in Folge = 1 Punkt. Pass von einem Joker über das Feld zum gegenüberliegenden Joker (über einen Innenspieler) = 1 Bonuspunkt.
  - Ball ins Aus oder erobert - sofort neuer Ball vom Trainer an das andere Team.
  - 4 Durchgänge à 4-5 Minuten, nach jedem Durchgang wechseln 4 Spieler (2 aus jedem Team) mit den Jokern.
regeln:
  - Innenspieler maximal 3 Kontakte, Joker maximal 2 Kontakte.
  - Joker dürfen nur auf ihrer Seitenlinie laufen und nicht zueinander passen, ohne dass ein Innenspieler dazwischen war.
  - Joker spielen nicht gegeneinander, kein Tackling gegen Joker.
coachingpunkte:
  - Breite und Tiefe – Innenspieler sollen sich zwischen den Gegnern anbieten, nicht alle zum Ball.
  - Dreiecke bilden, der ballnahe Spieler bietet sich kurz an, der zweite tief.
  - Seitenwechsel über den Joker suchen, wenn es eng wird.
  - Gegen den Ball - Passwege zuschieben, zu zweit auf den Ballführenden.
varianten:
  leichter: [Feld größer (40 x 35 m), Innenspieler frei in der Kontaktzahl]
  schwerer: [Innenspieler maximal 2 Kontakte, Joker direkt, 8 statt 10 Pässe, Feld 30 x 25 m]
  spielerzahl:
    - 16 Spieler = 6 gegen 6 + 4 Joker; 14 Spieler = 5 gegen 5 + 4 Joker; 12 Spieler = 4 gegen 4 + 4 Joker.
    - Ungerade Zahl - 5. Joker in der Mitte (spielt innen für das ballbesitzende Team).
quelle: eigene Übung (neu)
