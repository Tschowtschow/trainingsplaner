name: Torabschluss nach zwei Ablagen (2 Seiten, 2 TW)
schwerpunkte: [Torabschluss, Passspiel]
phase: [Hauptteil]
spieler_min: 6
spieler_max: 12
torhueter: ja
feldgroesse: ca. 50 x 40 m vor dem Großtor (Strafraum + Vorfeld)
material: [4 Stangen, 6 Hütchen, 15 Bälle, Leibchen in 2 Farben]
dauer_min: 15
intensitaet: 3
ablauf:
  - Zwei Gruppen à 4 Spieler (keine Gegner), links (A) und rechts (B) vom Tor, spiegelverkehrt. Je Seite 2 Stangen, eine ca. 26 m und eine ca. 20 m vor dem Tor (Maße unsicher).
  - Pro Seite 4 Positionen - A1 Start ca. 38 m vor dem Tor, A2 vor der hinteren Stange, A3 seitlich versetzt dahinter, A4 vor der vorderen Stange an der Strafraumgrenze.
  - A1 spielt flach nach vorne auf A2, A2 legt ab auf A3.
  - A3 spielt nach vorne auf A4 und startet, A4 legt in den Lauf von A3 ab.
  - A3 schließt direkt oder mit 2 Kontakten aus ca. 18-20 m ab (unsicher).
  - Sobald der Schuss raus ist, wirft der zweite Torhüter neben dem Tor einen neuen Ball zu B1 - jetzt startet die rechte Seite. So geht es ohne Pause abwechselnd links/rechts.
  - Nach jeder Aktion rücken die Spieler ihrer Seite eine Position weiter (A1 -> A2 -> A3 -> A4 -> A1).
regeln:
  - Pässe und Ablagen flach, maximal 2 Kontakte.
  - Abschluss vor dem Strafraum bzw. spätestens an der Strafraumgrenze.
  - Die Torhüter wechseln sich ab - einer im Tor, einer wirft den nächsten Ball ein (Wechsel nach jedem Schuss oder alle 2 Minuten, unsicher).
  - Wer verschießt, muss den Ball holen, alle anderen machen weiter.
coachingpunkte:
  - Ablagen mit der Innenseite, Ball mit leichtem Druck in den Lauf, nicht stoppen.
  - Vor dem Anspiel Schulterblick und anbieten, Körper offen zum Spiel.
  - Nach dem Pass sofort Tempo aufnehmen, Timing zum Ball finden.
  - Abschluss flach und platziert, Standbein neben den Ball, Oberkörper über den Ball.
  - Torhüter - nach dem Schuss sofort Ball holen und einwerfen, damit kein Leerlauf entsteht.
varianten:
  leichter:
    - Abschluss aus 16 m, vordere Stange an die Strafraumgrenze.
    - Ohne Direktspiel-Vorgabe, Ball zuerst mitnehmen.
  schwerer:
    - Alles direkt, Abschluss nur mit dem ersten Kontakt.
    - Ein Verteidiger startet beim Pass auf A4 von der Torlinie und stört den Abschluss.
    - Wettkampf - Seite A gegen Seite B, wer zuerst 10 Tore hat.
  spielerzahl:
    - Mit 6 Spielern 3 pro Seite - A1 übernimmt beide Pässe nach vorne, nur eine Ablage.
    - Mit 10-12 Spielern Startposition doppelt besetzen (5-6 pro Seite).
    - Ab 14 Spielern zweite Gruppe parallel im DFB-Käfig (z. B. 2-gegen-1 auf Minitore) und nach 7 Minuten tauschen.
    - Nur 1 Torhüter - Bälle als Depot neben dem Tor, ein Spieler aus der wartenden Gruppe spielt den Ball ein.
quelle: https://www.instagram.com/reel/DbkvnV8SVYW
unsicher:
  - Genaue Abstände der Stangen zum Tor (aus der Luftaufnahme geschätzt)
  - Genaue Laufwege und wer welche Ablage spielt (nur Muster Pass-Ablage-Pass-Ablage-Abschluss beschrieben)
  - Wie oft die Torhüter tauschen
