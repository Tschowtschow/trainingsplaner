name: Abschlussspiel Großtor gegen 2 Minitore (halber Platz)
schwerpunkte: [Torabschluss, Umschalten, Pressing]
phase: [Abschlussspiel]
spieler_min: 10
spieler_max: 20
torhueter: ja
feldgroesse: halber Platz, ca. 50 x 60 m (Grundlinie bis Mittellinie)
material: [2 Minitore, 8 Hütchen, Leibchen, 15 Bälle]   # Großtor ist am Platz
dauer_min: 25
intensitaet: 4
ablauf:
  - Zwei Teams spielen auf dem halben Platz. Team A greift das Großtor mit TW an, Team B die zwei Minitore auf der Mittellinie.
  - Nach der Hälfte der Zeit Seiten- und Aufgabentausch.
  - Neuer Ball vom TW oder von der Mittellinie (Trainer), damit kaum Pausen entstehen.
regeln:
  - Normales Spiel, kein Abseits.
  - "Schwerpunktregel: Ein Tor nach Ballgewinn in der gegnerischen Hälfte zählt doppelt (anpassen an den Wochenschwerpunkt)."
coachingpunkte:
  - Schwerpunkt der Einheit sichtbar machen – an die Coachingpunkte aus dem Hauptteil erinnern.
  - Wenig unterbrechen, nur kurze Hinweise in Spielpausen.
  - Nach Ballverlust sofort Gegenpressing.
varianten:
  leichter: [Neutraler Joker für das ballbesitzende Team]
  schwerer: [Max. 2 Kontakte in der eigenen Hälfte]
  spielerzahl:
    - 14 Feldspieler + 2 TW = 7 gegen 7, TW 1 im Großtor, TW 2 spielt als Feldspieler bei Team B (nach der Hälfte tauschen die TW).
    - Ungerade Zahl = ein neutraler Joker.
    - Ab 18 Feldspielern zweites Spiel 4 gegen 4 im DFB-Käfig, nach Hälfte tauschen.
quelle: eigene Übung (Beispiel, neu)
unsicher: []
feedback: []
