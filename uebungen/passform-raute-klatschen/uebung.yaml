name: Passform Raute mit Klatschen und Diagonalpass
schwerpunkte: [Passspiel, Koordination]
phase: [Hauptteil]
spieler_min: 6
spieler_max: 20
torhueter: nein
feldgroesse: Raute ca. 20 x 12 m pro Station (Hütchen A links, B oben, C unten, D rechts)
gruppengroesse: [6, 10]
material: [4 Hütchen pro Station, 2-3 Bälle pro Gruppe]
dauer_min: 25
intensitaet: 3
ablauf:
  - "Pro Station 4 Hütchen als Raute: A links (Start, 2-3 Spieler mit Bällen), B oben, C unten, D rechts (je 1-2 Spieler)."
  - A spielt flach auf B, startet nach vorn und bekommt den Ball von B direkt zurückgeklatscht.
  - A spielt diagonal in den Lauf von C, der sich vom Hütchen nach innen löst.
  - C spielt auf D, D nimmt in die Laufrichtung mit und dribbelt zurück zur Startposition A.
  - Jeder läuft seinem Pass hinterher (A nach B, B nach C, C nach D), der nächste Ball startet, sobald der Klatschpass von B gespielt ist.
  - Nach 10-12 Minuten Richtung wechseln (Start über C unten, Klatschen über C, Diagonalpass zu B) – damit kommt der andere Fuß dran.
regeln:
  - Klatschpass von B immer direkt.
  - Diagonalpass flach und in den Lauf, nicht auf den Fuß.
  - Ballannahme bei D mit dem ersten Kontakt nach vorn.
coachingpunkte:
  - Vor der Annahme Schulterblick, offene Stellung (Körper Richtung nächster Passempfänger).
  - "Pass mit der Innenseite, Standbein neben dem Ball, Fußspitze hoch."
  - "Timing: C startet erst, wenn A den Klatschpass annimmt – nicht zu früh."
  - Laut ansagen (Name, „Klatsch!“), Tempo der Pässe hoch halten.
varianten:
  leichter: [2 Kontakte bei B erlaubt, Raute kleiner (15 x 10 m)]
  schwerer: [Alle Pässe direkt, nur mit dem schwachen Fuß, Raute größer (25 x 15 m) mit scharfen Pässen]
  spielerzahl:
    - 6-10 Spieler pro Station, ab 12 Spielern zwei Stationen nebeneinander.
    - Bei 16 Spielern 2 Stationen à 8 (A 3, B 2, C 1, D 2).
    - Mit Wettkampf - welche Station schafft in 2 Minuten mehr fehlerfreie Durchgänge?
quelle: eigene Übung (neu)
